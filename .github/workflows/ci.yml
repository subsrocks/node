name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # Types and lint.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck

  test:
    # The engine and the agent against each platform's ffmpeg, renders end to end, the install
    # script in its sh, and every encode a preset can ask for: Ubuntu's ffmpeg on Linux, Homebrew's
    # ffmpeg-full on a Mac (Apple silicon: Homebrew builds nothing for Intel Macs).
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm, macos-15]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - name: ffmpeg
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
          HOMEBREW_NO_INSTALL_CLEANUP: 1
        run: |
          if [ "$RUNNER_OS" = macOS ]; then
            brew install ffmpeg-full
            echo "$(brew --prefix ffmpeg-full)/bin" >> "$GITHUB_PATH"
          else
            sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
          fi
      - run: ffmpeg -hide_banner -version | head -1
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: node scripts/encoders.ts

  programs:
    uses: ./.github/workflows/programs.yml

  image:
    # The image builds on each architecture it's released for, and its ffmpeg has everything a
    # render needs.
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      # From Google's copy of Docker's images when AWS's turns this runner away (Dockerfile).
      - run: |
          docker build -t subs-node . ||
            docker build --build-arg IMAGES=mirror.gcr.io/library -t subs-node .
      - run: docker run --rm subs-node version
      - run: docker run --rm subs-node doctor --url https://subs.rocks
