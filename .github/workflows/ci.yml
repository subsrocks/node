name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # Types and lint.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck

  ffmpeg:
    # The ffmpeg the macOS program brings, built once for each version of its script.
    uses: ./.github/workflows/ffmpeg.yml

  test:
    # The engine and the agent against the ffmpeg each platform renders with, renders end to end
    # (whole, and in pieces at once), the install script in its sh, and every encode a preset can
    # ask for: Ubuntu's ffmpeg on Linux, the program's own on Macs, Apple silicon and Intel.
    needs: [ffmpeg]
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm, macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - id: arch
        run: echo "arch=$(uname -m | sed 's/x86_64/x64/;s/aarch64/arm64/')" >> "$GITHUB_OUTPUT"
      - if: runner.os == 'macOS'
        uses: actions/download-artifact@v7
        with:
          name: ffmpeg-macos-${{ steps.arch.outputs.arch }}
          path: ${{ runner.temp }}/ffmpeg
      - name: ffmpeg
        run: |
          if [ "$RUNNER_OS" = macOS ]; then
            chmod 0755 "$RUNNER_TEMP/ffmpeg/bin/"*
            echo "$RUNNER_TEMP/ffmpeg/bin" >> "$GITHUB_PATH"
          else
            sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
          fi
      - run: ffmpeg -hide_banner -version | head -1
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: node scripts/encoders.ts

  programs:
    needs: [ffmpeg]
    uses: ./.github/workflows/programs.yml

  image:
    # The image builds on each architecture it's released for, and its ffmpeg has everything a
    # render needs.
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      # From Google's copy of Docker's images when AWS's turns this runner away (Dockerfile).
      - run: |
          docker build -t subs-node . ||
            docker build --build-arg IMAGES=mirror.gcr.io/library -t subs-node .
      - run: docker run --rm subs-node version
      - run: docker run --rm subs-node doctor --url https://subs.rocks
      # VA-API's drivers for Intel's and AMD's graphics, and the node as its own user.
      - run: docker run --rm --entrypoint sh subs-node -c 'ls /usr/lib/*/dri/*_drv_video.so'
      - run: test "$(docker run --rm --entrypoint /app/entrypoint.sh subs-node version >/dev/null && docker run --rm --entrypoint sh subs-node -c 'stat -c %U /data')" = subs
