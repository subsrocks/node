name: programs

# The program as a single executable, built on each platform it's released for, then installed and
# run as people do: `install.sh` piped into the platform's sh (dash on Ubuntu, macOS's old bash),
# from this run's files, and `subs-node doctor` with ffmpeg installed as people install it. CI runs
# it on every change; a release releases what it builds.

on:
  workflow_call:

permissions:
  contents: read

jobs:
  program:
    name: program (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
          - runner: ubuntu-24.04-arm
          - runner: macos-15
          # Homebrew builds nothing for Intel Macs (ffmpeg-full would compile for an hour), so
          # this one is installed and run, without an ffmpeg to check.
          - runner: macos-15-intel
            ffmpeg: none
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          # Builds single executables (25.5 and newer).
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node scripts/build.ts --sea
      - id: name
        # The executable: the file of dist/subs-node-<os>-<arch>* without an extension.
        run: |
          for file in dist/subs-node-*-*; do
            case "$file" in *.*) ;; *) echo "name=${file#dist/}" >> "$GITHUB_OUTPUT" ;; esac
          done
      - name: Packaged as a release packages it
        env:
          NAME: ${{ steps.name.outputs.name }}
        run: |
          mkdir -p "$RUNNER_TEMP/release"
          tar -czf "$RUNNER_TEMP/release/$NAME.tar.gz" -C dist "$NAME"
          cp scripts/install.sh "$RUNNER_TEMP/release/"
          cd "$RUNNER_TEMP/release" && shasum -a 256 "$NAME.tar.gz" > SHA256SUMS
      - name: ffmpeg, as people install it
        if: matrix.ffmpeg != 'none'
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
          HOMEBREW_NO_INSTALL_CLEANUP: 1
        run: |
          if [ "$RUNNER_OS" = macOS ]; then
            # Homebrew's ffmpeg with libass, which it keeps off the PATH: the program finds it.
            brew install ffmpeg-full
          else
            sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
          fi
      - name: Installed as people install it
        env:
          SUBS_NODE_FROM: file://${{ runner.temp }}/release
          SUBS_NODE_DIR: ${{ runner.temp }}/bin
        run: curl -fsSL "$SUBS_NODE_FROM/install.sh" | sh
      - name: It can render
        if: matrix.ffmpeg != 'none'
        run: '"$RUNNER_TEMP/bin/subs-node" doctor'
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.name.outputs.name }}
          path: ${{ runner.temp }}/release/${{ steps.name.outputs.name }}.tar.gz
          retention-days: 7
