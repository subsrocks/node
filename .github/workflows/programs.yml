name: programs

# The program as a single executable, built on each platform it's released for, packed as a
# release packs it (on a Mac, with the ffmpeg it brings, from ffmpeg.yml), then installed and run as
# people do: `install.sh` piped into the platform's sh (dash on Ubuntu, macOS's old bash), from
# this run's files, and `subs-node doctor`, which tries the machine's video hardware. CI runs it on
# every change; a release releases what it builds. Needs ffmpeg.yml's artifacts in the same run.

on:
  workflow_call:

permissions:
  contents: read

jobs:
  program:
    name: program (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm, macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          # Builds single executables (25.5 and newer).
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node scripts/build.ts --sea
      - id: name
        # The executable: the file of dist/subs-node-<os>-<arch>* without an extension.
        run: |
          for file in dist/subs-node-*-*; do
            case "$file" in *.*) ;; *) echo "name=${file#dist/}" >> "$GITHUB_OUTPUT" ;; esac
          done
      - id: arch
        run: echo "arch=$(uname -m | sed 's/x86_64/x64/;s/aarch64/arm64/')" >> "$GITHUB_OUTPUT"
      - if: runner.os == 'macOS'
        uses: actions/download-artifact@v7
        with:
          name: ffmpeg-macos-${{ steps.arch.outputs.arch }}
          path: ${{ runner.temp }}/ffmpeg
      - name: Packed as a release packs it
        env:
          NAME: ${{ steps.name.outputs.name }}
        run: |
          # A folder of the program and, on a Mac, the ffmpeg it brings.
          mkdir -p "$RUNNER_TEMP/release" "$RUNNER_TEMP/pack/$NAME"
          cp "dist/$NAME" "$RUNNER_TEMP/pack/$NAME/subs-node"
          if [ "$RUNNER_OS" = macOS ]; then
            cp -R "$RUNNER_TEMP/ffmpeg" "$RUNNER_TEMP/pack/$NAME/ffmpeg"
            chmod 0755 "$RUNNER_TEMP/pack/$NAME/ffmpeg/bin/"*
          fi
          tar -czf "$RUNNER_TEMP/release/$NAME.tar.gz" -C "$RUNNER_TEMP/pack" "$NAME"
          cp scripts/install.sh "$RUNNER_TEMP/release/"
          cd "$RUNNER_TEMP/release" && shasum -a 256 "$NAME.tar.gz" > SHA256SUMS
      - name: ffmpeg on Linux, as people install it
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Installed as people install it
        env:
          SUBS_NODE_FROM: file://${{ runner.temp }}/release
          SUBS_NODE_DIR: ${{ runner.temp }}/bin
          SUBS_NODE_HOME: ${{ runner.temp }}/home
        run: curl -fsSL "$SUBS_NODE_FROM/install.sh" | sh
      - name: It can render
        run: '"$RUNNER_TEMP/bin/subs-node" doctor'
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.name.outputs.name }}
          path: ${{ runner.temp }}/release/${{ steps.name.outputs.name }}.tar.gz
          retention-days: 7
