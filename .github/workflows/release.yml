name: release

# A version tag (`v1.2.3`, pushed when subs.rocks releases a new version of the node) publishes the
# image, for amd64 and arm64, and the program for Linux and macOS, with an install script and
# their checksums; then installs and runs them as people will, from where people get them.

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  packages: write

jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - id: version
        # 1.2.3, 1.2, 1 and latest.
        run: |
          version="${GITHUB_REF_NAME#v}"
          {
            echo 'tags<<EOF'
            for tag in "$version" "${version%.*}" "${version%%.*}" latest; do
              echo "ghcr.io/subsrocks/node:$tag"
            done
            echo EOF
          } >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Docker's images from AWS's copy of them, as the Dockerfile has it, or from Google's when AWS
      # turns this runner away: it limits what each address pulls, and runners share theirs.
      - id: build
        continue-on-error: true
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.version.outputs.tags }}
      - if: steps.build.outcome == 'failure'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.version.outputs.tags }}
          build-args: IMAGES=mirror.gcr.io/library

  programs:
    # Built, installed and checked on each platform (programs.yml), as CI does.
    uses: ./.github/workflows/programs.yml

  release:
    needs: [image, programs]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          # The programs, not the records of the image's builds that build-push-action uploads.
          pattern: subs-node-*
          path: out
          merge-multiple: true
      - run: |
          cp scripts/install.sh out/
          cd out && sha256sum ./*.tar.gz install.sh | sed 's# \./# #' > SHA256SUMS
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          # This version's notes, from the changelog.
          awk -v v="## $version" '$0 == v {on=1; next} /^## / {on=0} on' CHANGELOG.md > notes.md
          gh release create "$GITHUB_REF_NAME" out/* --title "subs-node $version" --notes-file notes.md

  published:
    # The release as people get it: the install line on each platform, and the image on each
    # architecture.
    needs: [release]
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm, macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    steps:
      - name: The install line
        env:
          SUBS_NODE_DIR: ${{ runner.temp }}/bin
        run: |
          curl -fsSL https://github.com/subsrocks/node/releases/latest/download/install.sh | sh
          installed="$("$SUBS_NODE_DIR/subs-node" version)"
          case "$installed" in
            "${GITHUB_REF_NAME#v} "*) ;;
            *) echo "::error::installed $installed, not ${GITHUB_REF_NAME#v}"; exit 1 ;;
          esac
      - name: The image
        if: runner.os == 'Linux'
        run: docker run --rm "ghcr.io/subsrocks/node:${GITHUB_REF_NAME#v}" doctor
