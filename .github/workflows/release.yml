name: release

# A version tag (`v1.2.3`, pushed when subs.rocks releases a new version of the node) publishes the
# image, for amd64 and arm64, and the program for Linux and macOS, with an install script and
# their checksums.

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  packages: write

jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - id: version
        run: |
          version="${GITHUB_REF_NAME#v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "minor=${version%.*}" >> "$GITHUB_OUTPUT"
          echo "major=${version%%.*}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/subsrocks/node:${{ steps.version.outputs.version }}
            ghcr.io/subsrocks/node:${{ steps.version.outputs.minor }}
            ghcr.io/subsrocks/node:${{ steps.version.outputs.major }}
            ghcr.io/subsrocks/node:latest

  programs:
    # Each platform's single executable, built on that platform.
    strategy:
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm, macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          # Builds single executables (25.5 and newer).
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node scripts/build.ts --sea
      - id: name
        run: echo "name=$(cd dist && ls subs-node-*-* | grep -v '\.')" >> "$GITHUB_OUTPUT"
      - run: ./dist/${{ steps.name.outputs.name }} version
      - run: tar -czf "dist/${{ steps.name.outputs.name }}.tar.gz" -C dist "${{ steps.name.outputs.name }}"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.name.outputs.name }}
          path: dist/${{ steps.name.outputs.name }}.tar.gz

  release:
    needs: [image, programs]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          path: out
          merge-multiple: true
      - run: |
          cp scripts/install.sh out/
          cd out && sha256sum ./*.tar.gz install.sh | sed 's# \./# #' > SHA256SUMS
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          # This version's notes, from the changelog.
          awk -v v="## $version" '$0 == v {on=1; next} /^## / {on=0} on' CHANGELOG.md > notes.md
          gh release create "$GITHUB_REF_NAME" out/* --title "subs-node $version" --notes-file notes.md
